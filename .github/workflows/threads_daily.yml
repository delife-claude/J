name: Threads 自動投稿パイプライン

on:
  schedule:
    # 水・金 JST 18:00 (= UTC 09:00)。Typefullyの月間公開上限(実測10回/月)に収めるため週2回に間引き。
    - cron: "0 9 * * 3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post, fetch Rakuten product, schedule to Typefully, notify LINE
        env:
          THREADS_GEMINI_API_KEY: ${{ secrets.THREADS_GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          MAX_PRICE: ${{ secrets.MAX_PRICE }}
          FOCUS_GOAL: ${{ secrets.FOCUS_GOAL }}
        run: python daily_pipeline.py

      - name: Commit generated drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet || git commit -m "Add Threads draft $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
